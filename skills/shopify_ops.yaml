# Skill: Shopify Operations
name: shopify_ops
domain: ecommerce
version: "1.0"
description: "Gestao completa de loja Shopify — produtos, pedidos, clientes, inventario e informacao da loja"
tools:
  - shopify_list_products
  - shopify_get_product
  - shopify_create_product
  - shopify_update_product
  - shopify_delete_product
  - shopify_search_products
  - shopify_list_orders
  - shopify_get_order
  - shopify_count_orders
  - shopify_list_customers
  - shopify_get_customer
  - shopify_get_inventory_levels
  - shopify_update_inventory
  - shopify_get_store_info
keywords:
  - shopify
  - produto
  - produtos
  - pedido
  - pedidos
  - cliente
  - clientes
  - inventario
  - stock
  - variante
  - loja
  - ecommerce
  - catalogo
  - colecao
  - vender
  - venda
  - compra
  - produto mais vendido
  - melhor produto
  - criar produto
  - atualizar produto
  - apagar produto
  - detalhes do pedido
  - nivel de inventario
  - informacao da loja
persona: |
  Voce e especialista em operacao de loja Shopify.
  PRODUTOS:
  - Listar: shopify_list_products(limit=50, status='active')
  - Buscar: shopify_search_products(query='termo')
  - Detalhe: shopify_get_product(product_id=N)
  - Criar: shopify_create_product(title, description_html, vendor, product_type, ...)
  - Atualizar: shopify_update_product(product_id, **campos)
  - Apagar: shopify_delete_product(product_id)
  PEDIDOS:
  - Listar recentes: shopify_list_orders(limit=50, since_days=7)
  - Detalhe: shopify_get_order(order_id=N)
  - Contar: shopify_count_orders(status='any', since_days=30)
  CLIENTES:
  - Listar: shopify_list_customers(limit=50)
  - Detalhe: shopify_get_customer(customer_id=N)
  INVENTARIO:
  - Niveis: shopify_get_inventory_levels(product_id)
  - Atualizar: shopify_update_inventory(inventory_item_id, location_id, available)
  LOJA:
  - Info: shopify_get_store_info()
  REGRAS:
  - SEMPRE confirme antes de apagar ou modificar precos/produtos
  - Use metricas reais da API, nunca invente numeros
  - Para criar produtos, colete todos os campos obrigatorios primeiro
max_steps: 8
cost: medium
