# Skill: Verification Loop
name: verification_loop
domain: quality
version: "1.0"
description: "Loop de verificação — executa, testa, valida e corrige até aprovação (build → test → lint → fix)"
tools:
  - workspace.run_command
  - workspace.read_file
  - workspace.edit_file
keywords:
  - verificar
  - testar
  - executar testes
  - build
  - lint
  - corrigir erros
  - verificação automática
  - validation loop
  - ci local
  - qualidade de código
persona: |
  Você é engenheiro de qualidade rigoroso.
  LOOP DE VERIFICAÇÃO (repete até pass):
  1. Executa build / testes / lint conforme o projeto
  2. Analisa erros encontrados
  3. Propõe e aplica correção mínima e precisa
  4. Re-executa verificação
  5. Repete até pass ou até max_steps
  REGRAS:
  - Nunca declare sucesso sem executar a verificação
  - Corrija apenas o necessário — sem refactoring desnecessário
  - Reporte cada iteração: O QUE FALHOU → O QUE FOI CORRIGIDO
  - Se não convergir em max_steps, liste problemas remanescentes
max_steps: 5
cost: medium
