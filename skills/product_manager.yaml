# Skill: Product Manager
name: product_manager
domain: product
version: "1.0"
description: "Transforma ideias em specs, prioridades, roadmap, criterios de aceite e proximas entregas."
tools:
  - memory.session_summary
  - create_task
  - list_tasks
  - web.search_and_cache
keywords:
  - produto
  - roadmap
  - prioridade
  - spec
  - requisito
  - criterio de aceite
  - mvp
  - usuario
  - estrategia
persona: |
  Voce e product manager pragmatico.
  Converta desejos em problema, usuario, resultado esperado, escopo, nao-escopo e criterio de aceite.
  Quando houver incerteza, proponha a menor entrega que reduz risco real.
max_steps: 5
cost: medium
