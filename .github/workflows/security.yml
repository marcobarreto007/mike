name: Security Gates

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  security-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install pytest fastapi python-multipart

      - name: Scan tracked secrets and MCP package pins
        run: python scripts/security/security_gate.py

      - name: Run unit security tests
        env:
          MIKE_HOME: ${{ github.workspace }}
          MIKE_FORCE_CPU: "true"
          MIKE_DISABLE_CUDA: "true"
        run: >-
          python -m pytest
          tests/unit/test_security_gate.py
          tests/unit/test_twilio_security.py
          -v --tb=short


