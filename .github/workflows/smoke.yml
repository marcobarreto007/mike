name: Smoke Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install -r config/requirements-dev.txt

      - name: Run unit tests
        env:
          MIKE_HOME: ${{ github.workspace }}
          MIKE_FORCE_CPU: "true"
          MIKE_DISABLE_CUDA: "true"
          MIKE_PROFILE_MARCO_PASSWORD: "ci_test_password"
          MIKE_PROFILE_VISITANTE_PASSWORD: "ci_test_visitante_password"
        run: |
          PYTHONPATH=core/server:core/chat:core/memory:core/autonomy:core/comms:core/integrations:core/mcp:core/orchestration \
          python -m pytest tests/unit --tb=short

      - name: Start Mike server for smoke
        env:
          MIKE_HOME: ${{ github.workspace }}
          MIKE_FORCE_CPU: "true"
          MIKE_DISABLE_CUDA: "true"
          MIKE_LLM_BACKEND: "deepseek"
          DEEPSEEK_API_KEY: "ci_dummy_key"
          MIKE_KNOWLEDGE_PATHS: "/tmp/mike-knowledge-empty"
          MIKE_SKIP_CONVERSATION_BACKFILL: "true"
          MIKE_PROFILE_MARCO_PASSWORD: "ci_test_password"
          MIKE_PROFILE_VISITANTE_PASSWORD: "ci_test_visitante_password"
        run: |
          PYTHONPATH=core/server:core/chat:core/memory:core/autonomy:core/comms:core/integrations:core/mcp:core/orchestration \
          python -m uvicorn mike_server:app --host 127.0.0.1 --port 8083 --log-level warning > /tmp/mike-server.log 2>&1 &
          echo $! > /tmp/mike-server.pid

          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8083/health >/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time"
          tail -n 200 /tmp/mike-server.log || true
          exit 1

      - name: Run smoke tests
        env:
          MIKE_SMOKE_SKIP_CHAT: "1"
        run: |
          python tests/test_smoke.py --port 8083 --timeout 120 --skip-chat

      - name: Stop Mike server and print logs
        if: always()
        run: |
          if [ -f /tmp/mike-server.log ]; then
            tail -n 200 /tmp/mike-server.log || true
          fi
          if [ -f /tmp/mike-server.pid ]; then
            kill $(cat /tmp/mike-server.pid) || true
          fi
